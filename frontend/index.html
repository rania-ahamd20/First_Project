<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark mb-4 shadow-sm" style="background-color: var(--dark-grey);">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold">Expense Tracker</span>
            <button id="btn-export-csv" class="btn btn-sm btn-outline-light">Export CSV</button>
        </div>
    </nav>

    <div class="spinner-backdrop" id="spinner-backdrop"></div>
    <div class="spinner-border" id="loading-spinner" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>

    <div class="container">
        <div id="alert-container"></div>

        <div class="row mb-4">
            <div class="col-lg-7 mb-4 mb-lg-0">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header text-white fw-bold" style="background-color: var(--teal-primary);">
                        <h5 class="mb-0">Add Expense</h5>
                    </div>
                    <div class="card-body">
                        <form id="add-form" class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Title</label>
                                <input type="text" class="form-control" id="add-title" required placeholder="e.g., Groceries">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Amount</label>
                                <input type="number" step="0.01" class="form-control" id="add-amount" required placeholder="0.00">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Category</label>
                                <select class="form-select" id="add-category" required>
                                    <option value="">Select Category...</option>
                                    <option value="Food">Food</option>
                                    <option value="Transport">Transport</option>
                                    <option value="Bills">Bills</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Date</label>
                                <input type="date" class="form-control" id="add-date" required>
                            </div>
                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-teal px-4 fw-bold">Save Expense</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white py-3 border-0">
                        <h5 class="mb-0 fw-bold" style="color: var(--dark-grey);">Category Breakdown</h5>
                    </div>
                    <div class="card-body d-flex align-items-center justify-content-center">
                        <canvas id="category-chart" style="max-height: 210px;"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="summary-grid mb-4">
            <div class="card text-white shadow-sm border-0" style="background-color: var(--teal-primary);">
                <div class="card-body">
                    <h6 class="card-title text-uppercase opacity-75">Total Amount</h6>
                    <h2 class="mb-0 fw-bold" id="summary-total">$0.00</h2>
                </div>
            </div>
            <div class="card text-white shadow-sm border-0" style="background-color: var(--orange-bright);">
                <div class="card-body">
                    <h6 class="card-title text-uppercase opacity-75">Number of Expenses</h6>
                    <h2 class="mb-0 fw-bold" id="summary-count">0</h2>
                </div>
            </div>
            <div class="card text-white shadow-sm border-0" style="background-color: var(--dark-grey-soft);">
                <div class="card-body">
                    <h6 class="card-title text-uppercase opacity-75">Highest Expense</h6>
                    <h2 class="mb-0 fw-bold" id="summary-highest">$0.00</h2>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white d-flex flex-wrap gap-2 justify-content-between align-items-center py-3 border-0">
                <h5 class="mb-0 fw-bold" style="color: var(--dark-grey);">Expense Report</h5>
                <div class="d-flex gap-2">
                    <input type="text" id="search-title" class="form-control form-control-sm" placeholder="Search by title...">
                    <select class="form-select form-select-sm w-auto" id="filter-category">
                        <option value="All">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead style="background-color: var(--teal-light); color: var(--dark-grey);">
                            <tr>
                                <th class="ps-3">Title</th>
                                <th>Amount</th>
                                <th>Category</th>
                                <th>Date</th>
                                <th class="text-end pe-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="expense-table-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header text-white" style="background-color: var(--teal-primary);">
                    <h5 class="modal-title">Edit Expense</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="edit-form">
                    <div class="modal-body">
                        <input type="hidden" id="edit-id">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Title</label>
                            <input type="text" class="form-control" id="edit-title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Amount</label>
                            <input type="number" step="0.01" class="form-control" id="edit-amount" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Category</label>
                            <select class="form-select" id="edit-category" required>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Bills">Bills</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Date</label>
                            <input type="date" class="form-control" id="edit-date" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-teal">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
